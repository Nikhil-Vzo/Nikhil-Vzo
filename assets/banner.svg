<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 220" width="100%" height="220">
  <defs>
    <!-- Deep Obsidian Background Gradient -->
    <linearGradient id="deepDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050505" />
      <stop offset="60%" stop-color="#0a0a0a" />
      <stop offset="100%" stop-color="#030303" />
    </linearGradient>

    <!-- Subtle Hairline Grid -->
    <pattern id="fineGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#262626" stroke-width="0.75" stroke-opacity="0.3" />
    </pattern>
  </defs>

  <style>
    .mono-meta {
      font-family: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.18em;
      fill: #737373;
    }
    .headline {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "SF Pro Display", Helvetica, Arial, sans-serif;
      font-size: 42px;
      font-weight: 800;
      letter-spacing: -0.03em;
      fill: #F5F5F7;
    }
    .tagline {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      font-size: 14px;
      font-weight: 400;
      letter-spacing: 0.01em;
      fill: #A3A3A3;
    }
    .tag-text {
      font-family: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, monospace;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.08em;
      fill: #D4D4D4;
    }
  </style>

  <!-- Frame Base -->
  <rect width="920" height="220" rx="12" fill="url(#deepDark)" />
  <rect width="920" height="220" rx="12" fill="url(#fineGrid)" />

  <!-- Outer Hairline Machined Border -->
  <rect x="0.5" y="0.5" width="919" height="219" rx="11.5" fill="none" stroke="#262626" stroke-width="1" />

  <!-- Top Metadata Bar -->
  <g transform="translate(36, 34)">
    <circle cx="5" cy="5" r="3" fill="#D4D4D4" />
    <text x="18" y="9" class="mono-meta">NIKHIL YADAV // DEPTH_WALKER // RAIPUR, IN</text>
    <text x="848" y="9" text-anchor="end" class="mono-meta">21.25° N · 81.63° E</text>
  </g>

  <!-- Headline & Subtitle -->
  <g transform="translate(36, 96)">
    <text x="0" y="0" class="headline">NIKHIL YADAV</text>
    <text x="0" y="28" class="tagline">Engineering resilient distributed systems, low-latency media, and verified campus networks.</text>
  </g>

  <!-- Deep Architecture Tags -->
  <g transform="translate(36, 160)">
    <!-- Tag 1 -->
    <g>
      <rect x="0" y="0" width="220" height="26" rx="6" fill="#141414" stroke="#262626" stroke-width="1" />
      <text x="16" y="17" class="tag-text">OTHRHALFF · 400+ USERS</text>
    </g>

    <!-- Tag 2 -->
    <g transform="translate(230, 0)">
      <rect x="0" y="0" width="180" height="26" rx="6" fill="#141414" stroke="#262626" stroke-width="1" />
      <text x="16" y="17" class="tag-text">WEBRTC · LIVEKIT</text>
    </g>

    <!-- Tag 3 -->
    <g transform="translate(420, 0)">
      <rect x="0" y="0" width="210" height="26" rx="6" fill="#141414" stroke="#262626" stroke-width="1" />
      <text x="16" y="17" class="tag-text">POSTGRES · REDIS · RLS</text>
    </g>

    <!-- Tag 4 -->
    <g transform="translate(640, 0)">
      <rect x="0" y="0" width="180" height="26" rx="6" fill="#141414" stroke="#262626" stroke-width="1" />
      <text x="16" y="17" class="tag-text">NEXT.JS 14 · NODE.JS</text>
    </g>
  </g>
</svg>
