<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="400">
  <defs>
    <!-- Deep Canvas Background -->
    <linearGradient id="canvasGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05070B" />
      <stop offset="50%" stop-color="#0A0E17" />
      <stop offset="100%" stop-color="#040609" />
    </linearGradient>

    <!-- Deep Sapphire Radial Ambient Glow (Accent #58A6FF) -->
    <radialGradient id="glowSapphire" cx="18%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#58A6FF" stop-opacity="0.14" />
      <stop offset="60%" stop-color="#58A6FF" stop-opacity="0" />
    </radialGradient>

    <!-- Subtle Emerald Flare for Live Operational Status -->
    <radialGradient id="glowLive" cx="85%" cy="85%" r="50%">
      <stop offset="0%" stop-color="#00E599" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#00E599" stop-opacity="0" />
    </radialGradient>

    <!-- Headline Linear Gradient -->
    <linearGradient id="headlineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="65%" stop-color="#F1F5F9" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>

    <!-- Precision Architectural Blueprint Grid -->
    <pattern id="archGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#FFFFFF" stroke-opacity="0.02" stroke-width="1" />
    </pattern>
  </defs>

  <style>
    .meta-code {
      font-family: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.22em;
      fill: #64748B;
      text-transform: uppercase;
    }
    .hero-name {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "SF Pro Display", Roboto, Helvetica, sans-serif;
      font-size: 64px;
      font-weight: 800;
      letter-spacing: -0.04em;
      fill: url(#headlineGrad);
    }
    .hero-pitch {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, sans-serif;
      font-size: 19px;
      font-weight: 400;
      letter-spacing: -0.01em;
      fill: #94A3B8;
      line-height: 1.5;
    }
    .hero-pitch-bold {
      font-weight: 600;
      fill: #E2E8F0;
    }
    .tag-title {
      font-family: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, monospace;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
    }
  </style>

  <!-- Frame Background with Soft Corners -->
  <rect width="1200" height="400" rx="16" fill="url(#canvasGrad)" />
  <rect width="1200" height="400" rx="16" fill="url(#archGrid)" />
  <rect width="1200" height="400" rx="16" fill="url(#glowSapphire)" />
  <rect width="1200" height="400" rx="16" fill="url(#glowLive)" />

  <!-- Outer Hairline Machined Border -->
  <rect x="0.5" y="0.5" width="1199" height="399" rx="15.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.07" stroke-width="1" />

  <!-- Top Metadata Bar -->
  <g transform="translate(54, 52)">
    <!-- Active Pulse Dot -->
    <circle cx="5" cy="5" r="4" fill="#00E599" />
    <circle cx="5" cy="5" r="8" fill="none" stroke="#00E599" stroke-width="1" stroke-opacity="0.3" />
    <text x="24" y="10" class="meta-code">DEPTH_WALKER // SYSTEMS &amp; FULL-STACK ARCHITECT</text>
    <text x="1092" y="10" text-anchor="end" class="meta-code">21.25°N · 81.63°E</text>
  </g>

  <!-- Title & Cinematic Pitch -->
  <g transform="translate(54, 154)">
    <text x="0" y="0" class="hero-name">NIKHIL YADAV</text>
    <text x="0" y="44" class="hero-pitch">
      <tspan class="hero-pitch-bold">Architecting high-concurrency campus networks</tspan> and resilient distributed systems.
    </text>
    <text x="0" y="74" class="hero-pitch">
      Sub-100ms real-time media · Zero-downtime operational pipelines · Battle-tested in production.
    </text>
  </g>

  <!-- High-Signal Architectural Badges -->
  <g transform="translate(54, 320)">
    <!-- Badge 1: Flagship -->
    <g>
      <rect x="0" y="0" width="280" height="34" rx="8" fill="#0F172A" stroke="#00E599" stroke-opacity="0.35" stroke-width="1" />
      <circle cx="18" cy="17" r="3.5" fill="#00E599" />
      <text x="32" y="22" class="tag-title" fill="#00E599">OTHRHALFF · 400+ ACTIVE USERS</text>
    </g>

    <!-- Badge 2: WebRTC / LiveKit -->
    <g transform="translate(296, 0)">
      <rect x="0" y="0" width="220" height="34" rx="8" fill="#0F172A" stroke="#58A6FF" stroke-opacity="0.35" stroke-width="1" />
      <circle cx="18" cy="17" r="3.5" fill="#58A6FF" />
      <text x="32" y="22" class="tag-title" fill="#58A6FF">WEBRTC &amp; LIVEKIT MEDIA</text>
    </g>

    <!-- Badge 3: Distributed Data -->
    <g transform="translate(532, 0)">
      <rect x="0" y="0" width="250" height="34" rx="8" fill="#0F172A" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="1" />
      <text x="20" y="22" class="tag-title" fill="#CBD5E1">POSTGRESQL · REDIS · RLS</text>
    </g>

    <!-- Badge 4: Stack -->
    <g transform="translate(798, 0)">
      <rect x="0" y="0" width="294" height="34" rx="8" fill="#0F172A" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="1" />
      <text x="20" y="22" class="tag-title" fill="#94A3B8">NEXT.JS 14 · NODE.JS · DOCKER</text>
    </g>
  </g>
</svg>
